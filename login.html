<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascendia — Secure Login</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#36abf7', 500: '#0c8fe9', 600: '#0270c7' },
            gold:  { 400: '#facc15', 500: '#eab308' },
            navy:  { 900: '#060a15', 950: '#03050a' },
          },
          fontFamily: {
            sans:  ['Inter', 'system-ui', 'sans-serif'],
            cinzel: ['Cinzel', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #03050a; }
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .brand-glow { box-shadow: 0 0 60px -10px rgba(12,143,233,0.35); }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 50px #0d1527 inset !important;
      -webkit-text-fill-color: #e2e8f0 !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 font-sans">

  <!-- Background orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-brand-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 left-1/4 w-96 h-96 bg-gold-500/5 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">

    <!-- Logo + Title -->
    <div class="text-center mb-8">
      <img src="logo.jpg" alt="Ascendia" class="w-16 h-16 rounded-2xl object-cover border border-gold-500/40 mx-auto mb-4 shadow-lg">
      <h1 class="text-2xl font-bold text-white" style="font-family:'Cinzel',serif; letter-spacing:.05em">ASCENDIA</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Secure Internal Portal</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-3xl p-8 brand-glow">

      <!-- Error banner -->
      <div id="errBanner" class="hidden mb-5 px-4 py-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-sm text-center">
        Invalid credentials. Please try again.
      </div>

      <form method="POST" action="/login" class="space-y-5">

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
          <input
            type="text"
            name="username"
            autocomplete="username"
            required
            class="w-full bg-navy-900/80 border border-white/10 focus:border-brand-500 outline-none rounded-xl px-4 py-3 text-slate-100 text-sm placeholder-slate-600 transition-colors"
            placeholder="Enter username"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              id="pwInput"
              name="password"
              autocomplete="current-password"
              required
              class="w-full bg-navy-900/80 border border-white/10 focus:border-brand-500 outline-none rounded-xl px-4 py-3 pr-12 text-slate-100 text-sm placeholder-slate-600 transition-colors"
              placeholder="Enter password"
            >
            <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-brand-500/25 transition-all transform hover:scale-[1.02] active:scale-[0.99]"
        >
          Sign In →
        </button>

      </form>

      <p class="text-center text-xs text-slate-600 mt-6">
        Authorized personnel only · Ascendia Investments Co
      </p>
    </div>

    <p class="text-center mt-6">
      <a href="/" class="text-xs text-slate-600 hover:text-slate-400 transition-colors">← Back to main site</a>
    </p>
  </div>

  <script>
    // Show error if redirected with ?error=1
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('errBanner').classList.remove('hidden');
    }

    function togglePw() {
      const inp = document.getElementById('pwInput');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
